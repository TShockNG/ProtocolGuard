name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore tests/ProtocolGuard.Tests/ProtocolGuard.Tests.csproj

      - name: Build
        run: dotnet build tests/ProtocolGuard.Tests/ProtocolGuard.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ProtocolGuard.Tests/ProtocolGuard.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Compute version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack src/ProtocolGuard/ProtocolGuard.csproj
          --configuration Release
          --no-build
          --output artifacts
          /p:PackageVersion=${{ steps.version.outputs.value }}

      - name: Push package
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
