name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/ProtocolGuard.Tests/ProtocolGuard.Tests.csproj

      - name: Build
        run: dotnet build tests/ProtocolGuard.Tests/ProtocolGuard.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ProtocolGuard.Tests/ProtocolGuard.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/ProtocolGuard/ProtocolGuard.csproj --configuration Release --no-build --output artifacts
