name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore src/ProtocolGuard/ProtocolGuard.csproj

      - name: Build
        run: dotnet build src/ProtocolGuard/ProtocolGuard.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/ProtocolGuard/ProtocolGuard.csproj --configuration Release --no-build --output artifacts
